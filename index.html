<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VIBRANZA 2026–27 · Entry Manager</title>
  <meta name="theme-color" content="#0b1b3f">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
:root{--navy:#0b1b3f;--navy2:#13275a;--blue:#1d56d8;--gold:#f3b233;--bg:#f3f5fa;--card:#fff;--line:#e2e6ef;--txt:#1b2238;--mut:#6b7590;
--ok:#1e7a3d;--okbg:#e2f4e8;--bad:#a8231b;--badbg:#fbe4e1;--pend:#8a5a00;--pendbg:#fff1d1;
--Agni:#d6453d;--Prithvi:#2f9a5a;--Garuda:#2f6fd0;--Vajra:#c99a0e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
.brand{display:flex;gap:10px;align-items:center}.brand small{display:block;font-size:11px;color:#b9c6e6}
.logo{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900}
.who{font-size:12px;text-align:right}.who button{margin-left:6px}
main{max-width:1100px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:20px;padding:8px 14px;font-weight:600}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfd5e3;border-radius:8px;font-size:15px;background:#fff;color:var(--txt)}
button{cursor:pointer;font:inherit}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:24px;display:block}.stat small{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-size:12px;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#f8f9fc}
.tbl{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:10px}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700}
.Approved{background:var(--okbg);color:var(--ok)}.Pending{background:var(--pendbg);color:var(--pend)}.Rejected,.Withdrawn{background:var(--badbg);color:var(--bad)}
.house{font-weight:800}.h-Agni{color:var(--Agni)}.h-Prithvi{color:var(--Prithvi)}.h-Garuda{color:var(--Garuda)}.h-Vajra{color:var(--Vajra)}
.check{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}.check.ok{background:var(--okbg);color:var(--ok)}.check.bad{background:var(--badbg);color:var(--bad)}
.muted{color:var(--mut)}.center{text-align:center;padding:30px}.small{font-size:12px}
.list .item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}.item .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;max-width:92vw;z-index:20}
.toast.show{opacity:1}.toast.err{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:15}.modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.login{max-width:380px;margin:40px auto}
.board{background:var(--navy);color:#fff;min-height:100vh;padding:24px}.board h1{text-align:center;color:var(--gold);letter-spacing:4px}
.brow{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);border-radius:14px;padding:16px 20px;margin:10px auto;max-width:900px;font-size:22px}
.brow .rk{font-size:30px;font-weight:900;width:40px;color:var(--gold)}.brow .nm{flex:1;font-weight:800}.brow .pt{font-size:34px;font-weight:900}
.chip{display:inline-block;background:#eef2fa;border-radius:6px;padding:1px 6px;font-size:12px;margin:1px}
.picklist{border:1px solid var(--line);border-radius:10px;max-height:52vh;overflow:auto;background:#fff}
.pick{display:flex;align-items:center;gap:10px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);text-transform:none;letter-spacing:0;font-size:15px;font-weight:600;color:var(--txt);cursor:pointer}
.pick:last-child{border-bottom:0}.pick input{width:22px;height:22px;flex:none;accent-color:var(--blue)}
.pick.on{background:#eaf1ff}.pick.dis{opacity:.5;cursor:not-allowed}
.pick .pn{flex:1}.pick .pn small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.pick .pt{font-size:12px;color:var(--mut);white-space:nowrap}.pick .pt.warn{color:var(--bad);font-weight:700}
@media print{.top,.tabs,.no-print{display:none!important}body{background:#fff}.card{border:0}}
</style>

</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">V</div>
      <div><b>VIBRANZA 2026–27</b><small>Vivekananda Public School, Daporijo</small></div>
    </div>
    <div id="who" class="who"></div>
  </header>

  <main id="app"><div class="center muted">Loading…</div></main>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden"><div class="sheet" id="modalBody"></div></div>

  <script>window.VIEW = new URLSearchParams(location.search).get('view') || '';</script>
  <script>
/* ======= SETTING: paste your Apps Script web-app link (Deploy → Manage deployments → Web app URL, ends in /exec) ======= */
const API_URL = 'PASTE_YOUR_EXEC_LINK_HERE';

/* ================= state + helpers ================= */
const S = { token: null, d: null, tab: null, f: {} };
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yes = v => /^(y|yes|true|1)$/i.test(String(v).trim());
const H = h => `<span class="house h-${esc(h)}">${esc(h || '—')}</span>`;
const pill = s => `<span class="pill ${esc(s)}">${esc(s)}</span>`;
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', err ? 6000 : 2500); }
function api(fn, ...args) {
  return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(r => r.json())
    .catch(() => { throw new Error('No connection to the server. Check internet (and API_URL at the top of index.html).'); })
    .then(x => {
      if (x.ok) return x.v;
      const m = String(x.err || 'Error');
      if (m.indexOf('SESSION_EXPIRED') >= 0) { store('vz_token', null); S.token = null; toast('Session expired — please log in again.', true); renderLogin(); }
      throw new Error(m.replace(/^Error:\s*/, ''));
    });
}
function modal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
const evById = id => S.d.events.find(e => String(e.EventID) === String(id)) || {};
const stuById = id => S.d.students.find(s => String(s.AdmNo) === String(id)) || {};
const cidx = c => S.d.classes.indexOf(String(c));
const isEntryEvent = e => String(e.Type).toLowerCase() !== 'no points' && !yes(e.NoEntries);
const eligible = (e, s) => {
  const i = cidx(s.Class), a = cidx(e.FromClass), b = cidx(e.ToClass);
  if (i < 0 || (a >= 0 && i < a) || (b >= 0 && i > b)) return false;
  if (e.Gender === 'Boys' && s.Gender !== 'Boy') return false;
  if (e.Gender === 'Girls' && s.Gender !== 'Girl') return false;
  return true;
};
const cnt = (adm, mod) => ((S.d.counts[String(adm)] || {})[mod || 'All']) || 0;

/* ================= boot ================= */
window.addEventListener('load', () => {
  if (window.VIEW === 'board') return renderBoard();
  S.token = load('vz_token');
  S.token ? refresh() : renderLogin();
});
function renderLogin() {
  $('#who').innerHTML = '';
  $('#app').innerHTML = `<div class="card login">
    <h3>Sign in</h3>
    <p class="muted small">House leaders, house teachers and school authority. Your User ID and PIN are given by the school office.</p>
    <label>User ID</label><input id="lu" autocomplete="username" placeholder="e.g. GARUDA-T1">
    <label>PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password">
    <div style="margin-top:14px"><button class="btn" style="width:100%" onclick="doLogin()">Sign in</button></div>
    <p class="small muted" style="margin-top:14px">Live scoreboard: add <b>?view=board</b> to this page's address.</p></div>`;
  $('#lp').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
async function doLogin() {
  try { const r = await api('login', $('#lu').value, $('#lp').value); S.token = r.token; store('vz_token', r.token); refresh(); }
  catch (e) { toast(e.message, true); }
}
async function logout() { try { await api('logout', S.token); } catch (e) {} store('vz_token', null); S.token = null; renderLogin(); }
async function refresh(keepTab) {
  try {
    S.d = await api('getData', S.token);
    const u = S.d.user;
    $('#who').innerHTML = `${esc(u.name)}<br><small>${esc(u.role)}${u.house ? ' · ' + H(u.house) : ''}</small> <button class="btn ghost sm" onclick="logout()">Sign out</button>`;
    renderShell(keepTab ? S.tab : null);
  } catch (e) { if (S.token) toast(e.message, true); }
}

/* ================= shell / tabs ================= */
function tabsFor(role) {
  if (role === 'AUTHORITY') return [['dash', 'Dashboard'], ['add', 'Add entry'], ['entries', 'All entries'], ['gaps', 'Gaps'], ['events', 'Events'], ['rules', 'Rules'], ['users', 'Users'], ['exc', 'Exceptions'], ['results', 'Results'], ['board', 'Scoreboard'], ['audit', 'Audit log']];
  if (role === 'JUDGE') return [['results', 'Results'], ['board', 'Scoreboard']];
  return [['add', 'Add entry'], ['mine', 'My house'], ['gaps', 'Gaps'], ['rulesView', 'Rules'], ['board', 'Scoreboard']];
}
function renderShell(tab) {
  const t = tabsFor(S.d.user.role);
  S.tab = tab && t.some(x => x[0] === tab) ? tab : t[0][0];
  $('#app').innerHTML = `<nav class="tabs">${t.map(x => `<button class="${x[0] === S.tab ? 'on' : ''}" onclick="go('${x[0]}')">${x[1]}${x[0] === 'mine' || x[0] === 'entries' ? pendBadge() : ''}</button>`).join('')}</nav><section id="view"></section>`;
  VIEWS[S.tab]();
}
function pendBadge() { const n = S.d.entries.filter(e => e.Status === 'Pending').length; return n ? ` (${n})` : ''; }
function go(t) { renderShell(t); }

const VIEWS = {
  dash: viewDash, add: viewAdd, mine: viewMine, entries: viewEntries, gaps: viewGaps, events: viewEvents,
  rules: viewRules, rulesView: viewRulesRO, users: viewUsers, exc: viewExc, results: viewResults, board: viewBoardTab, audit: viewAudit
};

/* ================= dashboard (authority) ================= */
function viewDash() {
  const E = S.d.entries, hs = S.d.houses;
  const by = (h, st) => E.filter(e => e.House === h && e.Status === st).length;
  const studs = h => S.d.students.filter(s => s.House === h);
  const noEvent = h => studs(h).filter(s => !E.some(e => String(e.AdmNo) === String(s.AdmNo) && ['Approved', 'Pending'].includes(e.Status))).length;
  $('#view').innerHTML = `
  <div class="grid">
    <div class="stat"><b>${E.filter(e => e.Status === 'Approved').length}</b><small>Approved entries</small></div>
    <div class="stat"><b>${E.filter(e => e.Status === 'Pending').length}</b><small>Waiting for approval</small></div>
    <div class="stat"><b>${S.d.events.filter(isEntryEvent).length}</b><small>Events taking entries</small></div>
    <div class="stat"><b>${S.d.students.length}</b><small>Students</small></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>House status</h3><div class="tbl"><table>
    <tr><th>House</th><th>Students</th><th>Approved</th><th>Pending</th><th>Rejected</th><th>No event yet</th></tr>
    ${hs.map(h => `<tr><td>${H(h)}</td><td>${studs(h).length}</td><td>${by(h, 'Approved')}</td><td>${by(h, 'Pending')}</td><td>${by(h, 'Rejected')}</td><td>${noEvent(h)}</td></tr>`).join('')}
  </table></div></div>
  <div class="card"><h3>Quick controls</h3><p class="small muted">Lock or unlock a whole day's entries (Rules → ENTRY_LOCK).</p>
  <div class="row">${['Exhibition', 'Arts', 'Sports'].map(m => { const r = S.d.rules.find(x => x.RuleID === 'ENTRY_LOCK' && x.Scope === m); const locked = r && yes(r.Active) && yes(r.Value);
    return `<button class="btn ${locked ? 'red' : 'green'}" onclick="toggleLock('${m}')">${m}: ${locked ? 'LOCKED — unlock' : 'open — lock'}</button>`; }).join('')}</div></div>`;
}
async function toggleLock(m) {
  const r = S.d.rules.find(x => x.RuleID === 'ENTRY_LOCK' && x.Scope === m) || { RuleID: 'ENTRY_LOCK', Description: 'Lock all entries for a day', Scope: m, Active: 'Yes', Value: 'No' };
  const next = Object.assign({}, r, { Value: yes(r.Value) && yes(r.Active) ? 'No' : 'Yes', Active: 'Yes' });
  try { await saveRuleRow(next, r); toast(m + ' entries ' + (yes(next.Value) ? 'locked' : 'opened')); refresh(true); } catch (e) { toast(e.message, true); }
}

/* ================= add entry ================= */
function viewAdd() {
  const u = S.d.user, auth = u.role === 'AUTHORITY';
  const f = S.f.add || (S.f.add = { mod: 'Arts', cat: '', house: auth ? (S.d.houses[0] || '') : u.house, ev: '', sel: [], q: '' });
  f.sel = f.sel || [];
  const house = auth ? f.house : u.house;
  const evs = S.d.events.filter(e => isEntryEvent(e) && e.Module === f.mod && (!f.cat || e.Category === f.cat));
  const cats = [...new Set(S.d.events.filter(e => e.Module === f.mod && isEntryEvent(e)).map(e => e.Category))];
  const ev = evById(f.ev);
  const hc = e => S.d.houseCount[e.EventID + '|' + house] || 0;
  const reset = "S.f.add.sel=[];S.f.add.q='';";
  $('#view').innerHTML = `<div class="card"><h3>Add participants</h3>
    ${auth ? `<label>House</label><select onchange="S.f.add.house=this.value;${reset}viewAdd()">${S.d.houses.map(h => `<option ${h === f.house ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select>` : `<p class="small muted">Adding for ${H(house)}. ${u.role === 'LEADER' && !(S.d.rules.find(r => r.RuleID === 'LEADER_AUTO_APPROVE' && yes(r.Value))) ? 'Your entries go to <b>Pending</b> until approved.' : ''}</p>`}
    <div class="row">
      <div><label>Day</label><select onchange="S.f.add.mod=this.value;S.f.add.cat='';S.f.add.ev='';${reset}viewAdd()">${['Exhibition', 'Arts', 'Sports'].map(m => `<option ${m === f.mod ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
      <div><label>Category</label><select onchange="S.f.add.cat=this.value;S.f.add.ev='';${reset}viewAdd()"><option value="">All</option>${cats.map(c => `<option ${c === f.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
    </div>
    <label>Event</label><select onchange="S.f.add.ev=this.value;${reset}viewAdd()"><option value="">— choose event —</option>
      ${evs.map(e => `<option value="${esc(e.EventID)}" ${e.EventID === f.ev ? 'selected' : ''}>${esc(e.Event)} · ${esc(e.Gender)} — ${hc(e)}/${e.MaxPerHouse || '∞'}${yes(e.Locked) ? ' · LOCKED' : ''}</option>`).join('')}</select>
    ${ev.EventID ? `<p class="small muted">Class ${esc(ev.FromClass)}–${esc(ev.ToClass)} · ${esc(ev.Gender)} · ${esc(ev.Type)}${ev.MaxPerHouse ? ' · max ' + esc(ev.MaxPerHouse) + ' per house' : ' · no per-house limit'}${yes(ev.CountsToLimit) ? ' · counts towards item limit' : ' · does not count towards item limit'}${ev.Date ? ' · ' + esc(ev.Date) + ' ' + esc(ev.Start) : ''}</p>` : ''}
    <div id="pick">${ev.EventID ? '' : '<p class="muted small">Choose an event to see eligible students.</p>'}</div>
    <div id="addRes"></div></div>
    ${ev.EventID ? currentForEvent(ev, house) : ''}`;
  if (ev.EventID) renderPick();
}
function itemLimit(mod) {
  const rs = S.d.rules.filter(r => r.RuleID === 'MAX_ITEMS_PER_STUDENT' && (r.Active === undefined || yes(r.Active)));
  const r = rs.find(x => String(x.Scope).toLowerCase() === String(mod).toLowerCase());
  return r ? Number(r.Value) : null;
}
function renderPick() {
  const u = S.d.user, f = S.f.add, ev = evById(f.ev);
  const house = u.role === 'AUTHORITY' ? f.house : u.house;
  const already = new Set(S.d.entries.filter(e => e.EventID === ev.EventID && ['Approved', 'Pending'].includes(e.Status)).map(e => String(e.AdmNo)));
  const used = S.d.houseCount[ev.EventID + '|' + house] || 0;
  const free = Number(ev.MaxPerHouse) > 0 ? Math.max(0, Number(ev.MaxPerHouse) - used) : Infinity;
  const lim = yes(ev.CountsToLimit) ? itemLimit(ev.Module) : null;
  const q = (f.q || '').toLowerCase();
  const studs = S.d.students.filter(s => s.House === house && eligible(ev, s) && (!q || (s.Name + ' ' + s.AdmNo + ' ' + s.Class).toLowerCase().includes(q)))
    .sort((a, b) => cidx(a.Class) - cidx(b.Class) || a.Name.localeCompare(b.Name));
  const full = f.sel.length >= free;
  const rows = studs.map(s => {
    const id = String(s.AdmNo), on = f.sel.includes(id), inEv = already.has(id);
    const n = cnt(s.AdmNo, ev.Module), atLim = lim !== null && n >= lim;
    const dis = inEv || (!on && full);
    return `<label class="pick ${on ? 'on' : ''} ${dis ? 'dis' : ''}"><input type="checkbox" ${on || inEv ? 'checked' : ''} ${dis ? 'disabled' : ''} onchange="toggleStu('${esc(id)}',this.checked)">
      <span class="pn">${esc(s.Name)}<small>Cl ${esc(s.Class)} · ${esc(s.AdmNo)} · ${esc(s.Gender)}</small></span>
      <span class="pt ${atLim ? 'warn' : ''}">${inEv ? 'already in' : (lim !== null ? `${n}/${lim} items` : `${n} items`)}</span></label>`;
  }).join('');
  if (!$('#pickSearch')) {
    $('#pick').innerHTML = `<label>Students — tick all you want to add</label>
      <input id="pickSearch" placeholder="Search name, class or adm no" value="${esc(f.q || '')}" oninput="S.f.add.q=this.value;renderPick()">
      <div id="plist"></div>
      <label>Note (optional, applies to all selected)</label><input id="addNote" placeholder="e.g. song title, team name">
      <div style="margin-top:12px"><button id="addBtn" class="btn" disabled onclick="saveEntries()">Add selected</button></div>
      <p class="small muted">Red item count = student already at the item limit; the app will block them and tell you why.</p>`;
  }
  $('#plist').innerHTML = `<p class="small ${full && free !== Infinity ? '' : 'muted'}" style="margin:8px 0">Selected <b>${f.sel.length}</b>${free === Infinity ? '' : ` · places left <b>${free - f.sel.length}</b> of ${ev.MaxPerHouse}`}${f.sel.length ? ` · <a href="#" onclick="S.f.add.sel=[];renderPick();return false">clear</a>` : ''}</p>
    <div class="picklist">${rows || '<p class="muted small" style="padding:10px">No eligible students' + (q ? ' match the search.' : ' in this house.') + '</p>'}</div>`;
  const b = $('#addBtn'); b.disabled = !f.sel.length; b.textContent = f.sel.length ? `Add ${f.sel.length} selected` : 'Add selected';
}
function toggleStu(id, on) {
  const f = S.f.add;
  f.sel = on ? [...new Set([...f.sel, id])] : f.sel.filter(x => x !== id);
  renderPick();
}
function currentForEvent(ev, house) {
  const list = S.d.entries.filter(e => e.EventID === ev.EventID && e.House === house && ['Approved', 'Pending'].includes(e.Status));
  return `<div class="card"><h3>${H(house)} in this event (${list.length}/${ev.MaxPerHouse || '∞'})</h3>${list.length ? `<div class="list">${list.map(e => `<div class="item"><div>${esc(e.StudentName)} <span class="muted small">Cl ${esc(e.Class)}</span></div>${pill(e.Status)}</div>`).join('')}</div>` : '<p class="muted small">No one yet.</p>'}</div>`;
}
async function saveEntries() {
  const f = S.f.add, btn = $('#addBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const r = await api('addEntries', S.token, f.ev, f.sel, ($('#addNote') || {}).value || '');
    f.sel = []; f.q = '';
    S.lastAdd = r;
    await refresh(true);
    const box = $('#addRes');
    if (box) box.innerHTML = `${r.added.length ? `<div class="check ok"><b>✓ Added ${r.added.length}:</b> ${r.added.map(x => esc(x.Name) + ' (' + esc(x.status) + ')').join(', ')}</div>` : ''}
      ${r.blocked.length ? `<div class="check bad"><b>Not added ${r.blocked.length}:</b><br>${r.blocked.map(x => '• ' + esc(x.Name) + ' — ' + esc(x.reason)).join('<br>')}</div>` : ''}`;
    toast(`${r.added.length} added${r.blocked.length ? ', ' + r.blocked.length + ' blocked' : ''}`, r.blocked.length > 0 && !r.added.length);
  } catch (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = 'Add selected'; } }
}

async function act(fn, id) { try { await api(fn, S.token, id); toast('Done'); refresh(true); } catch (e) { toast(e.message, true); } }
async function rej(id) { const r = prompt('Reason for rejecting?'); if (r === null) return; try { await api('rejectEntry', S.token, id, r); toast('Rejected'); refresh(true); } catch (e) { toast(e.message, true); } }
async function approveAll() {
  const ids = S.d.entries.filter(e => e.Status === 'Pending' && (!S.f.mine.mod || e.Module === S.f.mine.mod)).map(e => e.EntryID);
  let ok = 0, bad = [];
  for (const id of ids) { try { await api('approveEntry', S.token, id); ok++; } catch (e) { bad.push(e.message); } }
  toast(`${ok} approved${bad.length ? ', ' + bad.length + ' blocked by rules' : ''}`, bad.length > 0); refresh(true);
}
function printHouse() {
  const u = S.d.user, list = S.d.entries.filter(e => e.Status === 'Approved').sort((a, b) => String(a.EventName).localeCompare(b.EventName));
  const groups = {}; list.forEach(e => (groups[e.EventName] = groups[e.EventName] || []).push(e));
  const w = window.open('', '_blank');
  w.document.write(`<html><head><title>${esc(u.house || 'All houses')} participation</title><style>body{font-family:sans-serif;font-size:12px;margin:18px}h1{font-size:18px;margin:0}h2{font-size:13px;margin:14px 0 4px;background:#0b1b3f;color:#fff;padding:4px 8px}table{width:100%;border-collapse:collapse}td{border-bottom:1px solid #ccc;padding:3px 6px}</style></head><body>
    <h1>Vivekananda Public School, Daporijo · VIBRANZA 2026–27</h1><p>${esc(u.house || 'All houses')} — approved participation list · printed ${new Date().toLocaleString()}</p>
    ${Object.keys(groups).map(k => `<h2>${esc(k)}</h2><table>${groups[k].map((e, i) => `<tr><td width=24>${i + 1}</td><td>${esc(e.StudentName)}</td><td width=60>Cl ${esc(e.Class)}</td><td width=70>${esc(e.AdmNo)}</td><td width=70>${esc(e.House)}</td></tr>`).join('')}</table>`).join('')}

}

async function saveEdit(id, force) {
  const ch = { EventID: $('#eeEv').value, AdmNo: $('#eeAdm').value.trim(), Status: $('#eeSt').value };

  if (force) { reason = prompt('Reason for overriding the rules (saved in the audit log):'); if (!reason) return; }

    $('#eeMsg').innerHTML = `<div class="check bad"><b>Breaks rules:</b><br>${r.violations.map(v => '• ' + esc(v.msg)).join('<br>')}<br><button class="btn red sm" style="margin-top:8px" onclick="saveEdit('${id}',true)">Override with reason</button></div>`;

/* ================= gaps ================= */
function viewGaps() {
  const auth = S.d.user.role === 'AUTHORITY';
  const house = auth ? (S.f.gapH || S.d.houses[0]) : S.d.user.house;
  const live = S.d.entries.filter(e => ['Approved', 'Pending'].includes(e.Status) && e.House === house);
  const studs = S.d.students.filter(s => s.House === house);
  const none = studs.filter(s => !live.some(e => String(e.AdmNo) === String(s.AdmNo))).sort((a, b) => cidx(a.Class) - cidx(b.Class));
  const evs = S.d.events.filter(e => isEntryEvent(e) && studs.some(s => eligible(e, s)));
  const empty = evs.filter(e => !live.some(x => x.EventID === e.EventID));
  const under = evs.filter(e => { const n = live.filter(x => x.EventID === e.EventID).length; return n > 0 && Number(e.MaxPerHouse) > n; });
  $('#view').innerHTML = `${auth ? `<div class="card"><label>House</label><select onchange="S.f.gapH=this.value;viewGaps()">${S.d.houses.map(h => `<option ${h === house ? 'selected' : ''}>${h}</option>`).join('')}</select></div>` : ''}
   <div class="card"><h3>Events with no ${H(house)} entry (${empty.length})</h3>${empty.map(e => `<span class="chip">${esc(e.Event)} · ${esc(e.Gender)}</span>`).join(' ') || '<p class="muted">None 🎉</p>'}</div>
   <div class="card"><h3>Events with free places (${under.length})</h3>${under.map(e => `<span class="chip">${esc(e.Event)} · ${live.filter(x => x.EventID === e.EventID).length}/${e.MaxPerHouse}</span>`).join(' ') || '<p class="muted">None</p>'}</div>
   <div class="card"><h3>Students not in any event (${none.length})</h3><div class="list">${none.map(s => `<div class="item"><span>${esc(s.Name)}</span><span class="muted small">Cl ${esc(s.Class)} · ${esc(s.Gender)}</span></div>`).join('') || '<p class="muted">Everyone is in at least one event.</p>'}</div></div>`;
}

}
async function saveUser(orig) {
  const r = { UserID: $('#uId').value.trim(), Name: $('#uN').value, Role: $('#uR').value, House: $('#uH').value, PIN: $('#uP').value.trim(), Active: $('#uA').value, Phone: $('#uPh').value };
  if (!r.UserID) return toast('User ID required', true);
  try { await api('adminSave', S.token, 'Users', r, orig || r.UserID); closeModal(); toast('User saved'); refresh(true); } catch (e) { toast(e.message, true); }
}

/* ================= exceptions (authority) ================= */
function viewExc() {
  const ids = ['MAX_ITEMS_PER_STUDENT', 'CLASS_RANGE', 'GENDER_MATCH', 'HOUSE_LIMIT', 'TIME_CLASH', 'ENTRY_DEADLINE', 'CLOSE_HOURS_BEFORE', 'TEAM_MIX', 'EVENT_LOCK', 'ENTRY_LOCK'];
  $('#view').innerHTML = `<div class="card"><h3>Grant an exception</h3><p class="small muted">Lets one student bypass one rule (optionally for one event) without switching the rule off for everyone. Logged.</p>
    <div class="row"><div><label>Student Adm No</label><input id="xA" list="xAL"><datalist id="xAL">${S.d.students.map(s => `<option value="${esc(s.AdmNo)}">${esc(s.Name)} · ${esc(s.House)}</option>`).join('')}</datalist></div>
    <div><label>Rule</label><select id="xR">${ids.map(x => `<option>${x}</option>`).join('')}</select></div>
    <div><label>Event ID (optional)</label><input id="xE" placeholder="blank = all events"></div></div>
    <label>Reason</label><input id="xRe"><div style="margin-top:12px"><button class="btn" onclick="addExc()">Grant</button></div></div>
    <div class="card"><h3>Exceptions</h3><div class="tbl"><table><tr><th>Student</th><th>Rule</th><th>Event</th><th>Reason</th><th>By</th><th></th></tr>
    ${S.d.exceptions.map((x, i) => `<tr><td>${esc(stuById(x.AdmNo).Name || x.AdmNo)}</td><td class="small">${esc(x.RuleID)}</td><td class="small">${esc(x.EventID || 'all')}</td><td class="small">${esc(x.Reason)}</td><td class="small">${esc(x.GrantedBy)}</td><td><button class="btn red sm" onclick="delExc(${i})">✕</button></td></tr>`).join('')}</table></div></div>`;
}
async function addExc() {
  const r = { AdmNo: $('#xA').value.trim(), RuleID: $('#xR').value, EventID: $('#xE').value.trim(), Reason: $('#xRe').value };
  if (!r.AdmNo || !r.Reason) return toast('Adm No and reason are required', true);
  try { await api('adminSave', S.token, 'Exceptions', r); toast('Exception granted'); refresh(true); } catch (e) { toast(e.message, true); }
}
async function delExc(i) { if (!confirm('Remove this exception?')) return; try { await api('adminDelete', S.token, 'Exceptions', null, i); toast('Removed'); refresh(true); } catch (e) { toast(e.message, true); } }

/* ================= results ================= */
function viewResults() {
  const u = S.d.user, mine = S.d.events.filter(e => u.role === 'AUTHORITY' ? String(e.Type).toLowerCase() !== 'no points' : String(e.InCharge) === String(u.id));
  const f = S.f.res || (S.f.res = { ev: '' });
  const ev = evById(f.ev);
  const cur = S.d.results.filter(r => String(r.EventID) === String(f.ev));
  const team = ['Team game', 'Group stage', 'March past', 'Spirit', 'Business award'].includes(ev.Type);
  const entrants = S.d.entries.filter(e => e.EventID === f.ev && e.Status === 'Approved');
  const placeRow = p => { const r = cur.find(x => String(x.Place) === String(p)) || {};
    return `<div class="row"><div style="flex:0 0 60px"><label>Place</label><input value="${p}" disabled></div>
      ${team ? `<div><label>House</label><select id="rh${p}"><option value="">—</option>${S.d.houses.map(h => `<option ${h === r.House ? 'selected' : ''}>${h}</option>`).join('')}</select></div>`
             : `<div><label>Student</label><select id="ra${p}"><option value="">—</option>${entrants.map(e => `<option value="${esc(e.AdmNo)}" ${String(e.AdmNo) === String(r.AdmNo) ? 'selected' : ''}>${esc(e.StudentName)} · ${esc(e.House)}</option>`).join('')}</select></div>`}</div>`; };
  $('#view').innerHTML = `<div class="card"><h3>Enter results</h3>
    <label>Event</label><select onchange="S.f.res.ev=this.value;viewResults()"><option value="">— choose —</option>${mine.map(e => `<option value="${esc(e.EventID)}" ${e.EventID === f.ev ? 'selected' : ''}>${esc(e.Module)} · ${esc(e.Event)} · ${esc(e.Gender)}${S.d.results.some(r => String(r.EventID) === String(e.EventID)) ? ' ✓' : ''}</option>`).join('')}</select>
    ${ev.EventID ? `${[1, 2, 3, 4].map(placeRow).join('')}
      <p class="small muted">${team ? 'House result.' : entrants.length + ' approved entrants.'} Points come from the Points table (${esc(ev.Type)}).${cur.length ? ' Status: ' + (cur.some(r => yes(r.Published)) ? 'Published' : 'Not published') : ''}</p>
      <div class="row"><button class="btn" onclick="saveRes(${team})">Save results</button>
      ${u.role === 'AUTHORITY' && cur.length ? `<button class="btn ghost" onclick="pubRes(${!cur.some(r => yes(r.Published))})">${cur.some(r => yes(r.Published)) ? 'Unpublish' : 'Publish'}</button>` : ''}</div>` : ''}</div>`;
}
async function saveRes(team) {
  const places = [1, 2, 3, 4].map(p => team ? { Place: p, House: $('#rh' + p).value } : { Place: p, AdmNo: $('#ra' + p).value });
  try { await api('saveResults', S.token, S.f.res.ev, places); toast('Results saved'); refresh(true); } catch (e) { toast(e.message, true); }
}
async function pubRes(p) { try { await api('publishResults', S.token, S.f.res.ev, p); toast(p ? 'Published' : 'Unpublished'); refresh(true); } catch (e) { toast(e.message, true); } }

/* ================= scoreboard ================= */
async function viewBoardTab() {
  $('#view').innerHTML = '<div class="card center muted">Loading scoreboard…</div>';
  try { const b = await api('getScoreboard'); $('#view').innerHTML = `<div class="card"><h3>House championship (published results)</h3>${boardTable(b)}<p class="small muted">Updated ${esc(b.updated)} · public screen: add ?view=board to the app address.</p></div>`; }
  catch (e) { toast(e.message, true); }
}
function boardTable(b) {
  return `<div class="tbl"><table><tr><th>#</th><th>House</th><th>Exhibition</th><th>Arts</th><th>Sports</th><th>Other</th><th>Total</th></tr>
  ${b.rows.map((r, i) => `<tr><td>${i + 1}</td><td>${H(r.House)}</td><td>${r.Exhibition || 0}</td><td>${r.Arts || 0}</td><td>${r.Sports || 0}</td><td>${r.Fest || 0}</td><td><b>${r.Total}</b></td></tr>`).join('') || '<tr><td colspan=7 class="muted">No published results yet.</td></tr>'}</table></div>`;
}
async function renderBoard() {
  document.querySelector('.top').style.display = 'none';
  const paint = async () => {
    try {
      const b = await api('getScoreboard');
      $('#app').outerHTML = `<main id="app" class="board"><h1>VIBRANZA 2026–27</h1><p style="text-align:center;color:#b9c6e6">House Championship · Vivekananda Public School, Daporijo</p>
        ${b.rows.map((r, i) => `<div class="brow"><span class="rk">${i + 1}</span><span class="nm h-${esc(r.House)}" style="color:var(--${esc(r.House)})">${esc(r.House)}</span><span class="pt">${r.Total}</span></div>`).join('') || '<p style="text-align:center">Results will appear here.</p>'}
        ${b.recent.length ? `<p style="text-align:center;margin-top:24px;color:#b9c6e6">Latest winners: ${b.recent.map(x => esc(x.Event) + ' — ' + esc(x.House)).join(' · ')}</p>` : ''}
        <p style="text-align:center;font-size:12px;color:#7f8db0">Updated ${esc(b.updated)}</p></main>`;
    } catch (e) {}
  };
  paint(); setInterval(paint, 30000);
}

/* ================= audit (authority) ================= */
async function viewAudit() {
  $('#view').innerHTML = '<div class="card center muted">Loading…</div>';
  try {
    const rows = await api('getAudit', S.token, 300);
    $('#view').innerHTML = `<div class="card"><h3>Audit log (latest 300)</h3><div class="tbl"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>
      ${rows.map(r => `<tr><td class="small">${esc(r.Time)}</td><td>${esc(r.User)}</td><td class="small"><b>${esc(r.Action)}</b></td><td class="small" style="max-width:420px;word-break:break-word">${esc(r.Details)}</td></tr>`).join('')}</table></div></div>`;
  } catch (e) { toast(e.message, true); }
}
</script>
